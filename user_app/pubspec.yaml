name: user_app
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  firebase_core: ^2.9.0
  firebase_auth: ^4.4.0
  cloud_firestore: ^4.5.0
  firebase_storage: ^11.1.0

  carousel_slider: ^5.1.2

  image_picker: ^0.8.7+1
  geolocator: ^9.0.2
  geocoding: ^2.1.0
  shared_preferences: ^2.1.0

  flutter_staggered_grid_view: ^0.4.1
  number_inc_dec: ^0.8.0
  fluttertoast: ^8.2.1
  provider: ^6.0.5
  url_launcher: ^6.1.10
  intl: ^0.17.0
  timezone: ^0.9.1

  # Live rider tracking map
  google_maps_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/slider/

  fonts:
    - family: Acme
      fonts:
        - asset: assets/fonts/Acme-Regular.ttf

    - family: Kiwi
      fonts:
        - asset: assets/fonts/KiwiMaru-Medium.ttf

    - family: Signatra
      fonts:
        - asset: assets/fonts/Signatra.ttf

    - family: Train
      fonts:
        - asset: assets/fonts/TrainOne-Regular.ttf